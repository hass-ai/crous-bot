services:
  bot:
    build: .
    image: ghcr.io/hass-ai/crous-bot:${IMAGE_TAG:-latest}
    env_file: .env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - crous-data:/data
    healthcheck:
      test: ["CMD-SHELL", "find /data/bot.log -mmin -1 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  crous-data:
